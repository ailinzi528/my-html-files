<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map with Auto-Contrast Text Popup</title>
    
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.css' rel='stylesheet' />

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #map { width: 100%; height: 100vh; }

        /* 悬浮标签 (Caption) */
        .caption {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            padding: 4px 8px;
            border-radius: 4px;
            color: #333;
            font-size: 12px;
            pointer-events: none;
            visibility: hidden;
            white-space: nowrap;
            z-index: 1000;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transform: translate(-50%, -100%);
        }

        /* Mapbox Popup 容器基础设置 */
        .mapboxgl-popup {
            max-width: 400px !important;
        }

        .mapboxgl-popup-content {
            padding: 0 !important;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            background: transparent !important;
        }

        /* 整体可点击卡片容器 (3:4 宽高比) */
        .popup-card-link {
            display: block;
            position: relative;
            width: 400px;
            aspect-ratio: 3 / 4;
            text-decoration: none;
            overflow: hidden;
            border-radius: 2px;
            cursor: pointer;
        }

        /* 底图样式 */
        .popup-bg-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: filter 0.5s ease, transform 0.5s ease;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: high-quality;
            will-change: filter, transform;
        }

        .popup-card-link:hover .popup-bg-img {
            filter: blur(5px);
            transform: scale(1.00);
        }

        /* 遮罩文字层：默认偏左淡出 */
        .popup-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            padding: 24px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            opacity: 0;
            transform: translateX(-30px);
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .popup-card-link:hover .popup-overlay {
            opacity: 1;
            transform: translateX(0);
        }

        /* 🌟 1. 当图片偏暗时：极简纯白字，无阴影无黑描边 */
        .popup-overlay.dark-bg {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1); /* 极其轻微的底色仅作提亮区分 */
        }
        .popup-overlay.dark-bg .popup-index { color: rgba(255, 255, 255, 0.9); }
        .popup-overlay.dark-bg .popup-title { color: #ffffff; text-shadow: none; }
        .popup-overlay.dark-bg .popup-meta { color: rgba(255, 255, 255, 0.85); text-shadow: none; }
        .popup-overlay.dark-bg .popup-meta-label { color: rgba(255, 255, 255, 0.6); }

        /* 🌟 2. 当图片偏亮时：纯黑字 + 清爽半透明白背景 */
        .popup-overlay.light-bg {
            color: #111111;
            background: rgba(255, 255, 255, 0.1); /* 通透的清爽白色底 */
        }
        .popup-overlay.light-bg .popup-index { color: rgba(0, 0, 0, 1); }
        .popup-overlay.light-bg .popup-title { color: #111111; text-shadow: none; }
        .popup-overlay.light-bg .popup-meta { color: rgba(0, 0, 0, 1); text-shadow: none; }
        .popup-overlay.light-bg .popup-meta-label { color: rgba(0, 0, 0, 1); }

        .popup-index {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .popup-title {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.25;
            margin: 0 0 16px 0;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: none !important; /* 彻底移除阴影/描边 */
        }

        .popup-meta {
            margin-top: auto;
            font-size: 13px;
            line-height: 1.6;
            text-shadow: none !important;
        }

        .popup-meta-row {
            display: flex;
            gap: 8px;
            margin-bottom: 2px;
        }

        .popup-meta-label {
            flex-shrink: 0;
        }

        /* 关闭按钮：极简清爽风格 */
        .mapboxgl-popup-close-button {
            font-size: 18px;
            color: #666 !important;
            padding: 6px 10px !important;
            z-index: 10;
            background: transparent !important;
            border-radius: 0 8px 0 8px;
            text-shadow: none !important;
        }
        .mapboxgl-popup-close-button:hover {
            background-color: rgba(0, 0, 0, 0.08) !important;
            color: #000 !important;
        }
    </style>
</head>
<body>

<div id="map"></div>
<div id="caption" class="caption"></div>

<script>
    mapboxgl.accessToken = 'pk.eyJ1IjoiYWlsaW56aTUyOCIsImEiOiJjbHp0ZXQxZ3oyY2JuMnJyNHdxc2xndW94In0.1rfDN-c2Pjk5TztXwd0OLg';

    const SWITCH_ZOOM = 18;

    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/ailinzi528/cm07xbfvf00dc01om0ggg2fgv',
        center: [104.066, 30.650],
        zoom: 12
    });

    map.addControl(
        new mapboxgl.GeolocateControl({
            positionOptions: { enableHighAccuracy: true },
            trackUserLocation: true,
            showUserHeading: true
        }),
        'top-left'
    );

    map.addControl(new mapboxgl.NavigationControl(), 'top-left');

    let currentPopup = null;
    let selectedFeatureId = null;

    // 计算图片平均亮度的算法函数
    function getImageBrightness(imgElement, callback) {
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.src = imgElement.src;

        img.onload = function() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = 50;
            canvas.height = 50;
            ctx.drawImage(img, 0, 0, 50, 50);

            try {
                const imageData = ctx.getImageData(0, 0, 50, 50);
                const data = imageData.data;
                let r, g, b, avg;
                let colorSum = 0;

                for (let x = 0, len = data.length; x < len; x += 4) {
                    r = data[x];
                    g = data[x + 1];
                    b = data[x + 2];
                    avg = Math.floor(0.2126 * r + 0.7152 * g + 0.0722 * b);
                    colorSum += avg;
                }

                const brightness = Math.floor(colorSum / (50 * 50));
                callback(brightness);
            } catch (e) {
                console.log('图片跨域采样降级:', e);
                callback(100);
            }
        };

        img.onerror = function() {
            callback(100);
        };
    }

    function openPopup(coordinates, properties) {
        if (currentPopup) {
            currentPopup.remove();
        }

        let rawImgUrl = properties.img || properties.image || '';

        if (rawImgUrl.includes('images.are.na')) {
            try {
                const base64Str = rawImgUrl.split('images.are.na/')[1];
                let jsonStr = atob(base64Str);
                let jsonObj = JSON.parse(jsonStr);

                if (jsonObj.edits && jsonObj.edits.resize) {
                    jsonObj.edits.resize.width = 1200;
                    jsonObj.edits.resize.height = 1200;
                }
                if (jsonObj.edits && jsonObj.edits.jpeg) {
                    jsonObj.edits.jpeg.quality = 95;
                }
                if (jsonObj.edits && jsonObj.edits.webp) {
                    jsonObj.edits.webp.quality = 95;
                }

                const newBase64 = btoa(JSON.stringify(jsonObj));
                rawImgUrl = `https://images.are.na/${newBase64}`;
            } catch (e) {
                console.log('图片链接解析升级跳过:', e);
            }
        }

        const title = properties.name || properties['0_name'] || '未命名';
        const index = properties['1_index'] ? `[ ${properties['1_index']} ]` : '';
        const add = properties.add || '-';
        const desc = properties.description || properties.desc || '-';
        const link = properties['3_link'] || '#';

        const popupHTML = `
            <a href="${link}" target="_blank" class="popup-card-link">
                <img id="active-popup-img" class="popup-bg-img" src="${rawImgUrl}" alt="${title}">
                <div id="active-popup-overlay" class="popup-overlay dark-bg">
                    ${index ? `<div class="popup-index">${index}</div>` : ''}
                    <h3 class="popup-title">${title}</h3>
                    <div class="popup-meta">
                        <div class="popup-meta-row">
                            <span class="popup-meta-label">Location:</span>
                            <span>${add}</span>
                        </div>
                        <div class="popup-meta-row">
                            <span class="popup-meta-label">Desc:</span>
                            <span>${desc}</span>
                        </div>
                    </div>
                </div>
            </a>
        `;

        currentPopup = new mapboxgl.Popup({
            closeButton: true,
            closeOnClick: false,
            offset: 25
        })
        .setLngLat(coordinates)
        .setHTML(popupHTML)
        .addTo(map);

        const imgElement = document.getElementById('active-popup-img');
        const overlayElement = document.getElementById('active-popup-overlay');

        if (imgElement && overlayElement) {
            getImageBrightness(imgElement, function(brightness) {
                if (brightness > 128) {
                    overlayElement.classList.remove('dark-bg');
                    overlayElement.classList.add('light-bg');
                } else {
                    overlayElement.classList.remove('light-bg');
                    overlayElement.classList.add('dark-bg');
                }
            });
        }

        currentPopup.on('close', function() {
            if (selectedFeatureId !== null) {
                map.setFeatureState(
                    { source: 'geojson-data', id: selectedFeatureId },
                    { selected: false }
                );
                selectedFeatureId = null;
            }
        });
    }

    map.on('zoomstart', () => { if (currentPopup) currentPopup.remove(); });
    map.on('wheel', () => { if (currentPopup) currentPopup.remove(); });
    map.on('pitchstart', () => { if (currentPopup) currentPopup.remove(); });
    map.on('rotatestart', () => { if (currentPopup) currentPopup.remove(); });

    map.on('load', function() {
        map.addSource('geojson-data', {
            type: 'geojson',
            data: 'wts2024_0825.geojson',
            cluster: true,
            clusterMaxZoom: SWITCH_ZOOM - 1,
            clusterRadius: 100,
            generateId: true
        });

        map.addLayer({
            id: 'clusters',
            type: 'circle',
            source: 'geojson-data',
            filter: ['all', ['has', 'point_count'], ['<', ['zoom'], SWITCH_ZOOM]],
            paint: {
                'circle-color': '#ffee00',
                'circle-radius': ['step', ['get', 'point_count'], 20, 100, 30, 750, 40]
            }
        });

        map.addLayer({
            id: 'cluster-count',
            type: 'symbol',
            source: 'geojson-data',
            filter: ['all', ['has', 'point_count'], ['<', ['zoom'], SWITCH_ZOOM]],
            layout: {
                'text-field': '{point_count_abbreviated}',
                'text-font': ['DIN Offc Pro Medium', 'Arial Unicode MS Bold'],
                'text-size': 12
            }
        });

        map.addLayer({
            id: 'single-point-as-cluster',
            type: 'circle',
            source: 'geojson-data',
            filter: ['all', ['!', ['has', 'point_count']], ['<', ['zoom'], SWITCH_ZOOM]],
            paint: {
                'circle-color': '#ffee00',
                'circle-radius': 20
            }
        });

        map.addLayer({
            id: 'single-point-as-cluster-count',
            type: 'symbol',
            source: 'geojson-data',
            filter: ['all', ['!', ['has', 'point_count']], ['<', ['zoom'], SWITCH_ZOOM]],
            layout: {
                'text-field': '1',
                'text-font': ['DIN Offc Pro Medium', 'Arial Unicode MS Bold'],
                'text-size': 12
            }
        });

        map.addLayer({
            id: 'unclustered-point-outer',
            type: 'circle',
            source: 'geojson-data',
            filter: ['all', ['!', ['has', 'point_count']], ['>=', ['zoom'], SWITCH_ZOOM]],
            paint: {
                'circle-color': [
                    'case',
                    ['boolean', ['feature-state', 'selected'], false],
                    '#ffee00',
                    'rgba(255, 255, 255, 0.5)'
                ],
                'circle-radius': 20,
                'circle-stroke-width': [
                    'case',
                    ['boolean', ['feature-state', 'selected'], false],
                    0,
                    1.5
                ],
                'circle-stroke-color': '#ffee00'
            }
        });

        map.addLayer({
            id: 'unclustered-point-inner',
            type: 'circle',
            source: 'geojson-data',
            filter: ['all', ['!', ['has', 'point_count']], ['>=', ['zoom'], SWITCH_ZOOM]],
            paint: {
                'circle-color': [
                    'case',
                    ['boolean', ['feature-state', 'selected'], false],
                    '#ffffff',
                    '#ffee00'
                ],
                'circle-radius': 4.5
            }
        });

        map.on('click', 'unclustered-point-outer', function(e) {
            if (!e.features || !e.features.length) return;

            const feature = e.features[0];
            const coordinates = feature.geometry.coordinates.slice();

            if (selectedFeatureId !== null) {
                map.setFeatureState(
                    { source: 'geojson-data', id: selectedFeatureId },
                    { selected: false }
                );
            }

            selectedFeatureId = feature.id;
            map.setFeatureState(
                { source: 'geojson-data', id: selectedFeatureId },
                { selected: true }
            );

            openPopup(coordinates, feature.properties);
        });

        map.on('click', 'clusters', function(e) {
            const features = map.queryRenderedFeatures(e.point, { layers: ['clusters'] });
            if (!features.length) return;

            const currentZoom = map.getZoom();
            map.easeTo({
                center: features[0].geometry.coordinates,
                zoom: Math.min(currentZoom + 2, SWITCH_ZOOM),
                duration: 800
            });
        });

        map.on('click', 'single-point-as-cluster', function(e) {
            if (!e.features || !e.features.length) return;

            const currentZoom = map.getZoom();
            map.easeTo({
                center: e.features[0].geometry.coordinates,
                zoom: Math.min(currentZoom + 1.5, SWITCH_ZOOM),
                duration: 600
            });
        });

        map.on('click', function(e) {
            const features = map.queryRenderedFeatures(e.point, { layers: ['unclustered-point-outer', 'clusters', 'single-point-as-cluster'] });
            if (!features.length && currentPopup) {
                currentPopup.remove();
            }
        });

        map.on('mouseenter', 'unclustered-point-outer', function(e) {
            map.getCanvas().style.cursor = 'pointer';
            const features = e.features[0];
            const name = features.properties.name || features.properties['0_name'] || '未命名';
            const index = features.properties['1_index'] || '';
            
            const caption = document.getElementById('caption');
            caption.textContent = `${index} ${name}`;
            caption.style.visibility = 'visible';
            
            const pixelCoords = map.project(e.lngLat);
            caption.style.left = `${pixelCoords.x}px`;
            caption.style.top = `${pixelCoords.y - 22}px`;
        });

        map.on('mouseleave', 'unclustered-point-outer', function() {
            map.getCanvas().style.cursor = '';
            document.getElementById('caption').style.visibility = 'hidden';
        });

        map.on('mouseenter', 'clusters', function() { map.getCanvas().style.cursor = 'pointer'; });
        map.on('mouseleave', 'clusters', function() { map.getCanvas().style.cursor = ''; });
        map.on('mouseenter', 'single-point-as-cluster', function() { map.getCanvas().style.cursor = 'pointer'; });
        map.on('mouseleave', 'single-point-as-cluster', function() { map.getCanvas().style.cursor = ''; });
    });
</script>
</body>
</html>

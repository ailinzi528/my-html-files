<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map with Bottom Panel</title>
    
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.css' rel='stylesheet' />

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #map { width: 100%; height: 100vh; }

        /* 悬浮标签 (Caption) */
        .caption {
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            padding: 4px 8px;
            border-radius: 4px;
            color: #333;
            font-size: 12px;
            pointer-events: none;
            visibility: hidden;
            white-space: nowrap;
            z-index: 10;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transform: translate(-50%, -100%);
        }

        /* 底部抽屉弹窗 (Bottom Sheet) */
        .bottom-sheet {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 50vh;
            max-height: 500px;
            background-color: #fff;
            box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            transition: bottom 0.3s ease-in-out;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* 抽屉激活状态 */
        .bottom-sheet.active {
            bottom: 0;
        }

        /* 关闭按钮 */
        .close-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            background: rgba(230, 230, 250, 0.6);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            color: #555;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
        }
        .close-btn:hover { background: rgba(210, 210, 240, 0.9); }

        /* 内容布局 */
        .sheet-content {
            display: flex;
            height: 100%;
            padding: 24px;
            gap: 24px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .sheet-media {
            flex: 1;
            min-width: 250px;
            max-width: 50%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f5f5f5;
            border-radius: 6px;
            overflow: hidden;
        }

        .sheet-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sheet-info {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sheet-header-title {
            font-size: 24px;
            font-weight: 500;
            color: #222;
            margin: 0 0 16px 0;
        }

        .info-row {
            display: flex;
            margin-bottom: 12px;
            font-size: 14px;
            line-height: 1.5;
        }

        .info-label {
            width: 100px;
            color: #777;
            flex-shrink: 0;
        }

        .info-value {
            color: #333;
            flex-grow: 1;
        }

        .sheet-footer {
            margin-top: 20px;
        }

        .detail-btn {
            display: block;
            width: 100%;
            padding: 12px 0;
            border: 1px solid #4a4a8b;
            color: #4a4a8b;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .detail-btn:hover {
            background-color: #4a4a8b;
            color: #fff;
        }

        @media (max-width: 768px) {
            .bottom-sheet { height: 70vh; }
            .sheet-content { flex-direction: column; padding: 16px; }
            .sheet-media { max-width: 100%; height: 200px; }
        }
    </style>
</head>
<body>

<div id="map"></div>
<div id="caption" class="caption"></div>

<div id="bottom-sheet" class="bottom-sheet">
    <button class="close-btn" id="close-sheet">✕</button>
    <div class="sheet-content">
        <div class="sheet-media">
            <img id="sheet-img" src="" alt="preview">
        </div>
        <div class="sheet-info">
            <div>
                <h2 id="sheet-title" class="sheet-header-title">标题</h2>
                <div class="info-row">
                    <span class="info-label">编号/索引</span>
                    <span id="sheet-index" class="info-value">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">描述/详情</span>
                    <span id="sheet-desc" class="info-value">-</span>
                </div>
            </div>
            <div class="sheet-footer">
                <a id="sheet-link" href="#" target="_blank" class="detail-btn">More detail</a>
            </div>
        </div>
    </div>
</div>

<script>
    mapboxgl.accessToken = 'pk.eyJ1IjoiYWlsaW56aTUyOCIsImEiOiJjbHp0ZXQxZ3oyY2JuMnJyNHdxc2xndW94In0.1rfDN-c2Pjk5TztXwd0OLg';

    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/ailinzi528/cm07xbfvf00dc01om0ggg2fgv',
        center: [104.066, 30.650],
        zoom: 12
    });

    map.addControl(
        new mapboxgl.GeolocateControl({
            positionOptions: { enableHighAccuracy: true },
            trackUserLocation: true,
            showUserHeading: true
        }),
        'top-left'
    );

    map.addControl(new mapboxgl.NavigationControl(), 'top-left');

    const bottomSheet = document.getElementById('bottom-sheet');
    const closeBtn = document.getElementById('close-sheet');

    function openBottomSheet(properties) {
        document.getElementById('sheet-title').innerText = properties.name || '未命名';
        document.getElementById('sheet-index').innerText = properties['1_index'] || '-';
        document.getElementById('sheet-desc').innerText = properties.description || '-';
        document.getElementById('sheet-img').src = properties.img || '';
        document.getElementById('sheet-link').href = properties['3_link'] || '#';

        bottomSheet.classList.add('active');
    }

    function closeBottomSheet() {
        bottomSheet.classList.remove('active');
    }

    closeBtn.addEventListener('click', closeBottomSheet);

    // 新增：移动地图时（滑动、拖拽、滚轮缩放）自动关闭底部弹窗
    map.on('movestart', function() {
        closeBottomSheet();
    });

    map.on('load', function() {
        map.loadImage('https://files.cargocollective.com/c716192/pin.png', function(error, image) {
            if (error) throw error;
            map.addImage('custom-icon', image);

            map.addSource('geojson-data', {
                type: 'geojson',
                data: 'wts2024_0825.geojson',
                cluster: true,
                clusterMaxZoom: 14,
                clusterRadius: 80
            });

            map.addLayer({
                id: 'clusters',
                type: 'circle',
                source: 'geojson-data',
                filter: ['has', 'point_count'],
                paint: {
                    'circle-color': ['step', ['get', 'point_count'], '#ffee00', 100, '#ffee00', 750, '#ffee00'],
                    'circle-radius': ['step', ['get', 'point_count'], 20, 100, 30, 750, 40]
                }
            });

            map.addLayer({
                id: 'cluster-count',
                type: 'symbol',
                source: 'geojson-data',
                filter: ['has', 'point_count'],
                layout: {
                    'text-field': '{point_count_abbreviated}',
                    'text-font': ['DIN Offc Pro Medium', 'Arial Unicode MS Bold'],
                    'text-size': 12
                }
            });

            map.addLayer({
                id: 'unclustered-point',
                type: 'symbol',
                source: 'geojson-data',
                filter: ['!', ['has', 'point_count']],
                layout: {
                    'icon-image': 'custom-icon',
                    'icon-size': 0.12
                }
            });

            // 点击未聚合的点打开弹窗
            map.on('click', 'unclustered-point', function(e) {
                const properties = e.features[0].properties;
                openBottomSheet(properties);
                
                map.easeTo({
                    center: e.features[0].geometry.coordinates,
                    offset: [0, -100]
                });
            });

            // 点击地图空白处收起弹窗
            map.on('click', function(e) {
                const features = map.queryRenderedFeatures(e.point, { layers: ['unclustered-point', 'clusters'] });
                if (!features.length) {
                    closeBottomSheet();
                }
            });

            // 聚合点点击缩放
            map.on('click', 'clusters', function(e) {
                const features = map.queryRenderedFeatures(e.point, { layers: ['clusters'] });
                const clusterId = features[0].properties.cluster_id;
                map.getSource('geojson-data').getClusterExpansionZoom(clusterId, function(err, zoom) {
                    if (err) return;
                    map.easeTo({
                        center: features[0].geometry.coordinates,
                        zoom: zoom
                    });
                });
            });

            // Hover 悬浮标签逻辑
            map.on('mouseenter', 'unclustered-point', function(e) {
                map.getCanvas().style.cursor = 'pointer';
                const features = e.features[0];
                const name = features.properties.name || '未命名';
                const index = features.properties['1_index'] || '';
                
                const caption = document.getElementById('caption');
                caption.textContent = `${index} ${name}`;
                caption.style.visibility = 'visible';
                
                const pixelCoords = map.project(e.lngLat);
                caption.style.left = `${pixelCoords.x}px`;
                caption.style.top = `${pixelCoords.y - 15}px`;
            });

            map.on('mouseleave', 'unclustered-point', function() {
                map.getCanvas().style.cursor = '';
                document.getElementById('caption').style.visibility = 'hidden';
            });

            map.on('mouseenter', 'clusters', function() { map.getCanvas().style.cursor = 'pointer'; });
            map.on('mouseleave', 'clusters', function() { map.getCanvas().style.cursor = ''; });
        });
    });
</script>
</body>
</html>
